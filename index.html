<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Unser Universum</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 20%, #26345e 0%, #10182f 44%, #050713 100%);
      color: white;
      cursor: grab;
      user-select: none;
    }

    body.dragging {
      cursor: grabbing;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 50%, rgba(255,214,231,.12), transparent 28%),
        radial-gradient(circle at 70% 55%, rgba(160,190,255,.12), transparent 30%);
    }

    .intro {
      position: fixed;
      top: 34px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 720px);
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .intro .small {
      color: #ffd6e7;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: .75rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.4rem, 10vw, 5.4rem);
      line-height: .95;
      text-shadow: 0 10px 40px rgba(0,0,0,.45);
    }

    .intro p {
      max-width: 560px;
      margin: 0 auto;
      color: rgba(255,255,255,.78);
      line-height: 1.5;
      font-size: .98rem;
    }

    .year-link {
      position: fixed;
      z-index: 6;
      transform: translate(-50%, -50%);
      text-decoration: none;
      color: white;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    .star {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: radial-gradient(
        circle,
        #fff8c7 0%,
        #ffd6e7 30%,
        rgba(255,214,231,.24) 54%,
        rgba(255,214,231,0) 72%
      );
      box-shadow:
        0 0 32px rgba(255,214,231,.85),
        0 0 90px rgba(255,214,231,.35);
      animation: pulse 2.4s ease-in-out infinite alternate;
    }

    .year-link:nth-child(2) .star {
      animation-delay: .4s;
    }

    .year-link:nth-child(3) .star {
      animation-delay: .8s;
    }

    .year-link:nth-child(4) .star {
      animation-delay: 1.2s;
    }

    @keyframes pulse {
      from {
        transform: scale(.92);
        opacity: .78;
      }

      to {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    .label {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      padding: 10px 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 50px rgba(0,0,0,.28);
      min-width: 130px;
    }

    .label strong {
      display: block;
      font-size: 1rem;
    }

    .label span {
      display: block;
      font-size: .78rem;
      color: rgba(255,255,255,.72);
      margin-top: 2px;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 5;
      color: rgba(255,255,255,.78);
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      padding: 10px 15px;
      font-size: .9rem;
      backdrop-filter: blur(10px);
      pointer-events: none;
      white-space: nowrap;
    }

    .zoom-controls {
      position: fixed;
      right: 16px;
      bottom: 24px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .zoom-controls button {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 1.4rem;
      font-weight: 800;
      backdrop-filter: blur(10px);
    }


    .debug {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 20;
      font-size: .75rem;
      color: rgba(255,255,255,.55);
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      padding: 8px 10px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .star {
        width: 62px;
        height: 62px;
      }

      .label {
        padding: 9px 13px;
        min-width: 116px;
      }
    }
  </style>
</head>

<body>
  <canvas id="sky"></canvas>
  <div class="glow"></div>

  <header class="intro">
    <div class="small">Miles & Marie</div>
    <h1>Unser Universum</h1>
  </header>

  <div id="universe">
    <a class="year-link" href="jahr1.html" data-x="-260" data-y="0">
      <div class="star"></div>
      <div class="label">
        <strong>Jahr 1</strong>
      </div>
    </a>

    <a class="year-link" href="jahr2.html" data-x="260" data-y="0">
      <div class="star"></div>
      <div class="label">
        <strong>Jahr 2</strong>
      </div>
    </a>

    <a class="year-link" href="jahr3.html" data-x="680" data-y="-260">
      <div class="star"></div>
      <div class="label">
        <strong>Jahr 3</strong>
      </div>
    </a>
  </div>

  <div class="hint">Wähle einen Stern <3</div>
  <div class="zoom-controls">
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  </div>

  <script>
    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d");
    const links = document.querySelectorAll(".year-link");

    let stars = [];
    let time = 0;

    let cameraX = 0;
    let cameraY = 0;
    let zoom = 1;
    const minZoom = 0.45;
    const maxZoom = 1.8;

    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let dragStartCameraX = 0;
    let dragStartCameraY = 0;
    let moved = false;

    const universeBounds = {
      minX: -1200,
      maxX: 1200,
      minY: -900,
      maxY: 900
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function resize() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";

      ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
      );

      stars = Array.from({ length: 260 }, () => ({
        x: Math.random() * (universeBounds.maxX - universeBounds.minX) + universeBounds.minX,
        y: Math.random() * (universeBounds.maxY - universeBounds.minY) + universeBounds.minY,
        r: Math.random() * 1.4 + 0.25,
        a: Math.random() * .8 + .2,
        speed: Math.random() * .018 + .006
      }));

      updateUniverse();
    }

    function worldToScreen(x, y) {
      return {
        x: window.innerWidth / 2 + (x + cameraX) * zoom,
        y: window.innerHeight / 2 + (y + cameraY) * zoom
      };
    }

    function updateUniverse() {
      links.forEach(link => {
        const x = Number(link.dataset.x);
        const y = Number(link.dataset.y);
        const screen = worldToScreen(x, y);

        link.style.left = `${screen.x}px`;
        link.style.top = `${screen.y}px`;
        link.style.transform = `translate(-50%, -50%) scale(${zoom})`;
      });

    }

    function drawStars() {
      for (const star of stars) {
        const screen = worldToScreen(star.x, star.y);

        if (
          screen.x < -50 ||
          screen.x > window.innerWidth + 50 ||
          screen.y < -50 ||
          screen.y > window.innerHeight + 50
        ) {
          continue;
        }

        const alpha = star.a + Math.sin(time * star.speed) * .24;

        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${Math.max(.12, alpha)})`;
        ctx.arc(screen.x, screen.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawConnections() {
      const points = Array.from(links).map(link => ({
        x: Number(link.dataset.x),
        y: Number(link.dataset.y)
      }));

      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 214, 231, 0.24)";
      ctx.lineWidth = 1.2;

      points.forEach((point, index) => {
        const screen = worldToScreen(point.x, point.y);

        if (index === 0) {
          ctx.moveTo(screen.x, screen.y);
        } else {
          ctx.lineTo(screen.x, screen.y);
        }
      });

      ctx.stroke();
    }

    function animate() {
      time++;

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      drawStars();
      drawConnections();
      updateUniverse();

      requestAnimationFrame(animate);
    }

    function pointerDown(event) {
      isDragging = true;
      moved = false;

      document.body.classList.add("dragging");

      startX = event.clientX;
      startY = event.clientY;

      dragStartCameraX = cameraX;
      dragStartCameraY = cameraY;
    }

    function pointerMove(event) {
      if (!isDragging) return;

      const dx = event.clientX - startX;
      const dy = event.clientY - startY;

      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        moved = true;
      }

      cameraX = dragStartCameraX + dx;
      cameraY = dragStartCameraY + dy;

      cameraX = clamp(cameraX, -900, 900);
      cameraY = clamp(cameraY, -700, 700);
    }

    function pointerUp() {
      isDragging = false;
      document.body.classList.remove("dragging");
    }

    document.addEventListener("pointerdown", pointerDown);
    document.addEventListener("pointermove", pointerMove);
    document.addEventListener("pointerup", pointerUp);
    document.addEventListener("pointercancel", pointerUp);

    links.forEach(link => {
      link.addEventListener("click", event => {
        if (moved) {
          event.preventDefault();
        }
      });
    });

    window.addEventListener("resize", resize);

    document.getElementById("zoomIn").addEventListener("click", () => {
      zoom = Math.min(maxZoom, zoom + 0.15);
    });

    document.getElementById("zoomOut").addEventListener("click", () => {
      zoom = Math.max(minZoom, zoom - 0.15);
    });

    resize();
    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2 Jahre wir</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 20%, #26345e 0%, #10182f 44%, #050713 100%);
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .intro {
      position: fixed;
      top: 34px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 720px);
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .intro .small {
      color: #ffd6e7;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: .75rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.4rem, 10vw, 5.4rem);
      line-height: .95;
      text-shadow: 0 10px 40px rgba(0,0,0,.45);
    }

    .intro p {
      max-width: 560px;
      margin: 0 auto;
      color: rgba(255,255,255,.78);
      line-height: 1.5;
      font-size: .98rem;
    }

    .year-link {
      position: fixed;
      z-index: 6;
      transform: translate(-50%, -50%);
      text-decoration: none;
      color: white;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .star {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: radial-gradient(circle, #fff8c7 0%, #ffd6e7 30%, rgba(255,214,231,.24) 54%, rgba(255,214,231,0) 72%);
      box-shadow: 0 0 32px rgba(255,214,231,.85), 0 0 90px rgba(255,214,231,.35);
      animation: pulse 2.4s ease-in-out infinite alternate;
    }

    .year-link:nth-of-type(2) .star {
      animation-delay: .5s;
    }

    @keyframes pulse {
      from { transform: scale(.92); opacity: .78; }
      to { transform: scale(1.08); opacity: 1; }
    }

    .label {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      padding: 10px 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 50px rgba(0,0,0,.28);
    }

    .label strong {
      display: block;
      font-size: 1rem;
    }

    .label span {
      display: block;
      font-size: .78rem;
      color: rgba(255,255,255,.72);
      margin-top: 2px;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 5;
      color: rgba(255,255,255,.78);
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      padding: 10px 15px;
      font-size: .9rem;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 28% 52%, rgba(255,214,231,.15), transparent 28%),
        radial-gradient(circle at 72% 52%, rgba(160,190,255,.14), transparent 30%);
    }

    @media (max-width: 600px) {
      .year-link.jahr1 {
        left: 30%;
        top: 55%;
      }

      .year-link.jahr2 {
        left: 70%;
        top: 55%;
      }

      .star {
        width: 62px;
        height: 62px;
      }

      .label {
        padding: 9px 13px;
      }
    }

    @media (min-width: 601px) {
      .year-link.jahr1 {
        left: 38%;
        top: 55%;
      }

      .year-link.jahr2 {
        left: 62%;
        top: 55%;
      }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="glow"></div>

  <header class="intro">
    <div class="small">Unsere Sternenkarte</div>
    <h1>Unsere Timeline</h1>
  </header>

  <a class="year-link jahr1" href="jahr1.html" aria-label="Jahr 1 öffnen">
    <div class="star"></div>
    <div class="label">
      <strong>Jahr 1</strong>
    </div>
  </a>

  <a class="year-link jahr2" href="jahr2.html" aria-label="Jahr 2 öffnen">
    <div class="star"></div>
    <div class="label">
      <strong>Jahr 2</strong>
    </div>
  </a>

  <div class="hint">Wähle einen Stern</div>

  <script>
    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d");

    let stars = [];
    let width = 0;
    let height = 0;
    let time = 0;

    function resize() {
      width = canvas.width = window.innerWidth * window.devicePixelRatio;
      height = canvas.height = window.innerHeight * window.devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

      stars = Array.from({ length: 150 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.3 + 0.25,
        a: Math.random() * .8 + .2,
        speed: Math.random() * .018 + .006
      }));
    }

    function drawLineBetweenMainStars() {
      const isMobile = window.innerWidth <= 600;
      const y = window.innerHeight * 0.55;
      const x1 = window.innerWidth * (isMobile ? 0.30 : 0.38);
      const x2 = window.innerWidth * (isMobile ? 0.70 : 0.62);

      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 214, 231, 0.28)";
      ctx.lineWidth = 1.3;
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
    }

    function animate() {
      time++;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      for (const star of stars) {
        const alpha = star.a + Math.sin(time * star.speed) * .24;
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${Math.max(.12, alpha)})`;
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }

      drawLineBetweenMainStars();
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    resize();
    animate();
  </script>
</body>
</html>
